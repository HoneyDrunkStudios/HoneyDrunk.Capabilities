name: API Compatibility (Abstractions)

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'global.json'
      - 'Directory.Build.props'
      - '.github/workflows/api-compatibility.yml'
      - 'src/HoneyDrunk.Capabilities.Abstractions/**'
      - 'api/**'
      - 'tests/HoneyDrunk.Capabilities.Abstractions.Tests/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  abstractions-shape:
    name: Abstractions Shape
    uses: HoneyDrunkStudios/HoneyDrunk.Actions/.github/workflows/job-api-compatibility.yml@main
    with:
      dotnet-version: '11.0.100'
      project-path: src/HoneyDrunk.Capabilities.Abstractions/HoneyDrunk.Capabilities.Abstractions.csproj

  contract-shape:
    name: Contract Shape Canary
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: 11.0.100
      - name: Check the frozen contract shape
        run: dotnet test tests/HoneyDrunk.Capabilities.Abstractions.Tests -c Release --filter Category=ContractShape
